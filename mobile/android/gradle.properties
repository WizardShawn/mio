# Gradle JVM args — Compose + AGP appreciate the headroom.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# AndroidX is the only world we live in.
android.useAndroidX=true

# Kotlin / Compose live in their own incremental cache.
kotlin.code.style=official
kotlin.incremental=true

# Non-transitive R class shaves seconds off rebuilds; first introduced
# AGP 8.0+, default behaviour for new projects.
android.nonTransitiveRClass=true

# Configure on-demand keeps :app the only graph slice that compiles
# on a `./gradlew :app:assembleDebug`.
org.gradle.configureondemand=true
org.gradle.parallel=true

# AGP refuses to build when the project lives at a path containing
# non-ASCII characters (Chinese / Japanese / etc.) on Windows. That is
# a real constraint if you clone under such a path, but every build
# artefact AGP writes is under `mobile/android/`, which is plain ASCII,
# so the check is overly conservative here. Opt out explicitly.
android.overridePathCheck=true
