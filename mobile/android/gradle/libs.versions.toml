# Single source of truth for Android-side dependency versions.
# Keep in sync with `mobile/MOBILE_DEVELOPMENT.md`'s Phase-M-1 stack:
#   - Min SDK 26, target SDK 34
#   - Kotlin + Jetpack Compose
#   - OkHttp WebSocket client
#   - kotlinx.serialization for protocol mirror
#   - ML Kit barcode scanning for the QR pair flow
#   - CameraX for the QR scanner preview (lays groundwork for Phase M-3)

[versions]
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
coreKtx = "1.13.1"
lifecycle = "2.8.4"
activityCompose = "1.9.1"
composeBom = "2024.08.00"
kotlinxCoroutines = "1.8.1"
kotlinxSerialization = "1.7.1"
okhttp = "4.12.0"
mlkitBarcode = "17.3.0"
cameraX = "1.3.4"
zxing = "3.5.3"
androidxWebkit = "1.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
# M-2.6 — `ProcessLifecycleOwner` lives in the lifecycle-process artifact and lets the
# foreground service decide whether `chat.showWarning` should be rendered as a Snackbar
# (UI is foreground) or as a heads-up notification (UI is backgrounded).
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Networking — the only WS client in the project.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Coroutines for IO + flow-based event streams.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Protocol mirror lives in net/Protocol.kt; serialised via kotlinx.serialization.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# QR scanning — ML Kit's bundled-model variant so we don't need Play Services for first-run.
# (Unbundled "vision-barcode-scanning" is smaller but late-init via Play Services; we
# prioritise reliability on side-loaded APKs over APK size.)
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }

# CameraX preview/analysis pipeline for the QR scanner. Reused by Phase M-3 (back-cam
# perception), which is why the dep lands now even though the live capture surface is
# only the QR scanner today.
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }

# AndroidX WebKit — gives us `WebViewCompat.addWebMessageListener` for the JS↔Kotlin
# bridge in M-2.2 (the supportable replacement for `addJavascriptInterface`, scoped
# by origin instead of leaking onto every page).
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
