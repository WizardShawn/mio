<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
    />
    <title>Mio — Menu</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="menu" class="menu" role="menu" aria-label="Mio tray menu">
      <header class="header">
        <div class="brand">
          <span id="status-dot" class="status-dot" data-tone="idle"></span>
          <div class="brand-text">
            <span class="brand-name">Mio</span>
            <span id="status-label" class="brand-status">Idle</span>
          </div>
        </div>
      </header>

      <ul class="items">
        <li>
          <button
            type="button"
            class="item"
            role="menuitem"
            data-action="toggle-avatar"
          >
            <span class="item-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
                <circle cx="10" cy="7" r="3.2" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M3.5 16.5c1.2-3 3.7-4.5 6.5-4.5s5.3 1.5 6.5 4.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span id="avatar-toggle-label" class="item-label">Hide avatar</span>
          </button>
        </li>

        <li>
          <button
            type="button"
            class="item"
            role="menuitem"
            data-action="toggle-pause-agent"
          >
            <span class="item-icon" aria-hidden="true">
              <svg
                id="agent-icon"
                viewBox="0 0 20 20"
                width="16"
                height="16"
                fill="currentColor"
              >
                <rect x="6" y="5" width="2.5" height="10" rx="0.6" />
                <rect x="11.5" y="5" width="2.5" height="10" rx="0.6" />
              </svg>
            </span>
            <span id="agent-toggle-label" class="item-label">Pause agent</span>
          </button>
        </li>

        <li class="divider" role="separator"></li>

        <li>
          <button
            type="button"
            class="item"
            role="menuitem"
            data-action="open-settings"
          >
            <span class="item-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
                <circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.5" />
                <path
                  d="M10 2.5v1.7M10 15.8v1.7M3.6 6.5l1.5.85M14.9 12.65l1.5.85M3.6 13.5l1.5-.85M14.9 7.35l1.5-.85M2.5 10h1.7M15.8 10h1.7"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="item-label">Settings…</span>
          </button>
        </li>

        <li class="divider" role="separator"></li>

        <li>
          <button
            type="button"
            class="item danger"
            role="menuitem"
            data-action="quit"
          >
            <span class="item-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
                <path
                  d="M12 3.5h3a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-3"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M9 6.5 5.5 10 9 13.5M5.5 10h8"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="item-label">Quit</span>
          </button>
        </li>
      </ul>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
