<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
    />
    <title>Mio — Permission</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="card" class="card">
      <!-- ─── Approval prompt ─── -->
      <section id="prompt" class="prompt" hidden>
        <header class="phead">
          <span class="picon" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none">
              <path
                d="M10 2.5 4 5v4.5c0 3.6 2.5 6.6 6 8 3.5-1.4 6-4.4 6-8V5l-6-2.5Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <path
                d="M7.5 10l1.8 1.8L13 8"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <h1 id="prompt-title" class="ptitle">Mio wants to…</h1>
        </header>

        <p id="prompt-summary" class="psummary"></p>
        <pre id="prompt-preview" class="ppreview" hidden></pre>

        <div class="pbuttons">
          <button id="btn-deny" type="button" class="pbtn deny">Deny</button>
          <button id="btn-once" type="button" class="pbtn">Allow once</button>
          <button id="btn-task" type="button" class="pbtn">For this task</button>
          <button id="btn-always" type="button" class="pbtn primary">Always allow</button>
        </div>
      </section>

      <!-- ─── Computer-use status bar ─── -->
      <section id="status" class="status-bar" hidden>
        <span class="cu-dot" aria-hidden="true"></span>
        <span class="cu-text">
          <span id="status-label">Mio is controlling your screen</span>
          <span id="status-step" class="cu-step"></span>
        </span>
        <button id="btn-stop" type="button" class="pbtn deny">Stop</button>
      </section>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
