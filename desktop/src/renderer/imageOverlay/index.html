<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'self';"
    />
    <title>Mio — Image</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="card" class="card" hidden>
      <div class="frame">
        <img id="img" alt="" draggable="false" />
        <button
          id="btn-close"
          type="button"
          class="close"
          aria-label="Dismiss"
        >
          &times;
        </button>
      </div>
      <div id="intent" class="intent" hidden></div>
      <div class="actions">
        <button id="btn-copy" type="button" class="oa-btn">Copy</button>
        <button id="btn-open" type="button" class="oa-btn">Open</button>
        <button id="btn-reveal" type="button" class="oa-btn">Show</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
